name: Daily Check-in

on:
  schedule:
    # cron は UTC 指定。日本時間 00:10 に実行（= 前日 15:10 UTC）
    - cron: '10 15 * * *'
    # 保険：日本時間 12:10 にもう一度（押し済みなら何もしないので二重実行しても安全）
    - cron: '10 3 * * *'
  workflow_dispatch:
    inputs:
      debug:
        description: 'ページ本文をログに出力する（公開ログに個人情報が出る可能性あり）'
        type: boolean
        default: false

# 同時に走らせない
concurrency:
  group: daily-checkin
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run check-in
        env:
          USER_NAME: ${{ secrets.USER_NAME }}
          USER_PASSWORD: ${{ secrets.USER_PASSWORD }}
          TARGET_URL: ${{ secrets.TARGET_URL }}
          # 以下は「自動判別がうまくいかなかった場合」だけ Variables に設定すればよい（任意）
          LOGIN_URL: ${{ vars.LOGIN_URL }}
          USER_SELECTOR: ${{ vars.USER_SELECTOR }}
          PASS_SELECTOR: ${{ vars.PASS_SELECTOR }}
          SUBMIT_SELECTOR: ${{ vars.SUBMIT_SELECTOR }}
          CHECKIN_SELECTOR: ${{ vars.CHECKIN_SELECTOR }}
          CHECKIN_TEXTS: ${{ vars.CHECKIN_TEXTS }}
          ALREADY_TEXTS: ${{ vars.ALREADY_TEXTS }}
          SUCCESS_TEXTS: ${{ vars.SUCCESS_TEXTS }}
          DEBUG_DUMP: ${{ inputs.debug }}
        run: python checkin.py
